[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "libwconr"
version = "0.1.3"
description = "Python ctypes wrapper for the native libwconr package-manager library."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["libwconr", "wconr", "ctypes", "wrapper", "package-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/StevenGandon/WinConveyoR"
Source = "https://github.com/StevenGandon/WinConveyoR/tree/main/lib/wrappers/python"
Issues = "https://github.com/StevenGandon/WinConveyoR/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/libwconr"]

[tool.hatch.build.targets.sdist]
include = ["src/libwconr", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

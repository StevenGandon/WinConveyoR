version: '3'

volumes:
  mirror-data:
    driver: local
    driver_opts:
        o: bind
        type: none
        device: ./mirror-example

services:
  http-server:
    volumes:
      - mirror-data:/mnt/mirror
    build:
      context: http
    ports:
      - "${HTTP_MIRROR_PORT}:80"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: on-failure

  custom-server:
    volumes:
      - mirror-data:/mnt/mirror
    build:
      context: mirror-server
    ports:
      - "${CUSTOM_MIRROR_PORT}:1674"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      WCR_DIR: "/mnt/mirror"
    restart: on-failure

name: test

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get install -y cmake gcc libxml2-dev

      - name: Install Criterion (Linux)
        run: sudo apt-get install -y libcriterion-dev

      - name: Coverage setup
        run: |
          pip install gcovr

      - name: Build and test
        run: |
          sh ./scripts/lib/build_linux-test.sh

      - name: Generate coverage
        run: |
          gcovr -r . build/linux-amd64-test/lib --xml-pretty --xml -o coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

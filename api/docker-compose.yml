services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: abstract_api
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/abstract_api
      SECRET_KEY: dev-secret-key
    depends_on:
      - db

volumes:
  pgdata:
